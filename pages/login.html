<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id>MindSpace</title>
    <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
    <link rel="stylesheet" href="../css/main.css">

</head>

<body id="login">
    <div class="login-wrapper">
        <div class="backbutton-wrapper">
            <button onclick="history.back()" class="back-btn"><img class="login-arrow" src="../assets/back-btn.svg">Go Back</button>
            <img id="login-logo" src="../assets/mindspace-logo.PNG">
        </div>
        <div class="info">
            <h1 id="wlcmsg">
                Welcome Back!
            </h1>
            <p>
                Don't have an account yet?
                <a href="../pages/signup.html">Sign Up</a>
            </p>
            
        </div>
        <div class="email">
            <input type="text" name="email" id="email" placeholder="ramesh.kamineni@gmail.com" maxlength="50">
        </div>
        <div class="password">
            <input type="password" name="password" id="password" placeholder="Password" maxlength="50">
        </div>
        <div class="login-button">
            <button id="login-btn">Login</button>
        </div>
        <div class="login-options">
            <a href="https://google.com"><img class="login-option-img" src="../assets/google.svg"></a>
            <a href="https://apple.com"><img class="login-option-img" src="../assets/apple.svg"></a>
            <a href="https://twitter.com"><img class="login-option-img" src="../assets/twitter.svg"></a>
        </div>
    </div>
</body>


</html>
