<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thread | MindSpace</title>
  <link rel="icon" href="../assets/mindspace-logo.PNG">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body id="thread">

<header>
  <div class="header-wrapper">
    <div class="logo-wrapper">
      <a class="logo" href="../index.html">
        <img src="../assets/logo-withtname.svg">
      </a>
    </div>
  </div>
</header>

<div class="hero-forums">

  <div class="forums-post-wrapper">
    <h1 id="title"></h1>
    <p id="author"></p>

    <ul id="replies" class="forums-comments"></ul>

    <!-- REPLY BOX -->
    <div class="forums-entry">
      <textarea id="reply" class="forums-textbox" placeholder="Write a reply..."></textarea>
      <button id="reply-btn" class="action-btn">Reply</button>
    </div>
  </div>

</div>

<script>
var token = localStorage.getItem("token");
var params = new URLSearchParams(window.location.search);
var id = params.get("id");

/* LOAD THREAD */
fetch("http://localhost:3000/api/threads/" + id)
  .then(function(res) { return res.json(); })
  .then(function(data) {
    document.getElementById("title").textContent = data.thread.title;
    document.getElementById("author").textContent = "By " + data.thread.username;

    var replies = document.getElementById("replies");
    data.replies.forEach(function(r) {
      var li = document.createElement("li");
      li.innerHTML = "<strong>" + r.username + "</strong><p>" + r.content + "</p>";
      replies.appendChild(li);
    });
  });

/* POST REPLY */
document.getElementById("reply-btn").onclick = function () {
  if (!reply.value) return;

  fetch("http://localhost:3000/api/threads/reply", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      threadId: id,
      content: reply.value
    })
  }).then(function() {
    location.reload();
  });
};
</script>

</body>
</html>
