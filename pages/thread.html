<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thread | MindSpace</title>
  <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body id="thread">
  <header>
    <div class="header-wrapper">
      <div class="logo-wrapper">
        <a class="logo" href="../index.html"><img src="../assets/logo-withtname.svg"></a>
      </div>
    </div>
  </header>

  <div class="hero-forums">
    <div class="forums-post-wrapper">
      <h1 id="title"></h1>
      <p id="author"></p>

      <ul id="replies"></ul>

      <form id="replyForm">
        <textarea id="reply" placeholder="Write a reply" required></textarea>
        <button>Reply</button>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    fetch(`/api/threads/${id}`)
      .then(res => res.json())
      .then(data => {
        title.textContent = data.thread.title;
        author.textContent = "By " + data.thread.username;

        data.replies.forEach(r => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${r.username}</strong>: ${r.content}`;
          replies.appendChild(li);
        });
      });

    replyForm.onsubmit = async e => {
      e.preventDefault();
      await fetch("/api/threads/reply", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          threadId: id,
          content: reply.value
        })
      });
      location.reload();
    };
  </script>
</body>
</html>
