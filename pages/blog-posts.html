<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog | MindSpace</title>
    <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <h1 id="title"></h1>
    <p id="author"></p>
    <p id="date"></p>
    <div id="content"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        async function fetchBlog() {
            const res = await fetch(`/api/blogs/${id}`);
            if (!res.ok) {
                document.body.innerHTML = "<p>Blog not found.</p>";
                return;
            }
            const data = await res.json();

            document.getElementById("title").textContent = data.title;
            document.getElementById("author").textContent = "By " + data.author;
            document.getElementById("date").textContent = new Date(data.created_at).toLocaleString();
            document.getElementById("content").textContent = data.content;
        }

        fetchBlog();
    </script>
</body>
</html>
