<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threads | MindSpace</title>
  <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body id="threads">
  <header>
    <div class="header-wrapper">
      <div class="logo-wrapper">
        <a class="logo" href="../index.html"><img src="../assets/logo-withtname.svg"></a>
      </div>
    </div>
  </header>

  <div class="hero-forums">
    <h1>Threads</h1>
    <form id="newThread">
      <input id="title" placeholder="Thread title" required>
      <textarea id="content" placeholder="First post" required></textarea>
      <button>Create Thread</button>
    </form>

    <ul id="threads"></ul>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const params = new URLSearchParams(window.location.search);
    const category = params.get("category");

    fetch(`/api/threads?category=${category}`)
      .then(res => res.json())
      .then(threads => {
        const list = document.getElementById("threads");
        threads.forEach(t => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="thread.html?id=${t.id}">${t.title}</a> — by ${t.username}`;
          list.appendChild(li);
        });
      });

    document.getElementById("newThread").onsubmit = async e => {
      e.preventDefault();
      await fetch("/api/threads", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          title: title.value,
          content: content.value,
          categoryId: category
        })
      });
      location.reload();
    };
  </script>
</body>
</html>
