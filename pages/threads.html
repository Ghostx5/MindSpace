<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threads | MindSpace</title>
  <link rel="icon" href="../assets/mindspace-logo.PNG">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body id="threads">

<header>
  <div class="header-wrapper">
    <div class="logo-wrapper">
      <a class="logo" href="../index.html">
        <img src="../assets/logo-withtname.svg">
      </a>
    </div>
  </div>
</header>

<div class="hero-forums">

  <!-- CREATE THREAD -->
  <div class="forums-entry">
    <input id="title" class="forums-textbox" placeholder="Thread title">
    <textarea id="content" class="forums-textbox" placeholder="Start the discussion..."></textarea>
    <button id="create-thread" class="action-btn">Post</button>
  </div>

  <!-- THREAD LIST -->
  <div class="forums-post-wrapper">
    <ul id="threads" class="forums-comments"></ul>
  </div>

</div>

<script>
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
var token = localStorage.getItem("token");
var params = new URLSearchParams(window.location.search);
var category = params.get("category");

/* LOAD THREADS */
fetch("http://localhost:3000/api/threads?category=" + category)
  .then(function(res) { return res.json(); })
  .then(function(data) {
    var list = document.getElementById("threads");
    data.forEach(function(t) {
      var li = document.createElement("li");
      li.innerHTML =
        '<a href="thread.html?id=' + t.id + '">' +
        '<strong>' + t.title + '</strong>' +
        '</a> — by ' + t.username;
      list.appendChild(li);
    });
  });

/* CREATE THREAD */
document.getElementById("create-thread").onclick = function () {
  if (!title.value || !content.value) return;

  fetch("http://localhost:3000/api/threads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      title: title.value,
      content: content.value,
      categoryId: category
    })
  }).then(function() {
    location.reload();
  });
};
</script>

</body>
</html>
