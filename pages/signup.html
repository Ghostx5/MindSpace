<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MindSpace</title>
    <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body id="login">
<div class="login-wrapper">
    <div class="backbutton-wrapper">
        <button onclick="history.back()" class="back-btn">
            <img class="login-arrow" src="../assets/back-btn.svg">Back
        </button>
    </div>
    <div class="login-logo">
        <img id="login-logo" src="../assets/mindspace-logo.PNG">
    </div>
    <div class="info">
        <h1 id="wlcmsg">Welcome In!</h1>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
    <div class="text-fields">
        <div id="name">
            <input class="textbox" type="text" name="name" id="name" placeholder="Goonesh" maxlength="50">
        </div>
        <div id="email">
            <input class="textbox" type="text" name="email" id="email" placeholder="ramesh.kamineni@gmail.com" maxlength="50">
        </div>
        <div id="password">
            <input class="textbox" type="password" name="password" id="password" placeholder="Password" maxlength="50">
        </div>
    </div>
    <div class="login-direct">
        <button id="signup-btn">Sign Up</button>
    </div>
    <div id="msg" class="note"></div>
</div>

<script>
document.getElementById("signup-btn").onclick = async () => {
    const username = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    try {
        const res = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (res.ok) {
            msg.textContent = "Account created! Redirecting to login...";
            msg.style.color = "green";
            setTimeout(() => { window.location.href = "login.html"; }, 1200);
        } else {
            msg.textContent = data.message;
            msg.style.color = "red";
        }
    } catch (err) {
        msg.textContent = "Signup failed. Try again.";
        msg.style.color = "red";
    }
};
</script>
</body>
</html>
