<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forums | MindSpace</title>
  <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body id="forums">
  <header>
    <div class="header-wrapper">
      <div class="logo-wrapper">
        <a class="logo" href="../index.html"><img src="../assets/logo-withtname.svg"></a>
      </div>
      <div class="nav-wrapper">
        <nav class="navbar">
          <ul>
            <li><a href="../pages/mental-health-info.html">Mental Health Info</a></li>
            <li><a href="../pages/blog-posts.html">Blog Posts</a></li>
            <li><a href="../pages/forums.html">Forums</a></li>
            <li><a href="../pages/testimonials.html">Testimonials</a></li>
          </ul>
        </nav>
      </div>
      <div class="login-btn-wrapper">
        <a href="../pages/login.html" class="login-direct">Login</a>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="overlay-menu">
        <ul>
          <li><a href="../pages/mental-health-info.html">Mental Health Info</a></li>
          <li><a href="../pages/blog-posts.html">Blog Posts</a></li>
          <li><a href="../pages/forums.html">Forums</a></li>
          <li><a href="../pages/testimonials.html">Testimonials</a></li>
        </ul>
      </div>
    </div>
  </header>

  <div class="hero-forums">
    <h1>Forums</h1>
    <ul id="categories"></ul>
  </div>

  <script>
    fetch("/api/categories")
      .then(res => res.json())
      .then(categories => {
        const list = document.getElementById("categories");
        categories.forEach(cat => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="threads.html?category=${cat.id}">${cat.name}</a> — ${cat.description}`;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
