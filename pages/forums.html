<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forums | MindSpace</title>
</head>
<body>
  <h1>Forums</h1>
  <ul id="categories"></ul>

  <script>
    fetch("/api/categories")
      .then(res => res.json())
      .then(categories => {
        const list = document.getElementById("categories");
        categories.forEach(cat => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="threads.html?category=${cat.id}">
            ${cat.name}</a> — ${cat.description}`;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
