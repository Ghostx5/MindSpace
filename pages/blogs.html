<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blogs | MindSpace</title>
</head>
<body>
  <h1>Blogs</h1>
  <ul id="blogs">
    <!-- List of blog links will go here -->
  </ul>

  <script>
    // Example hardcoded blogs; replace with actual IDs/titles
    const blogs = [
      { id: 1, title: "My First Blog Post" },
      { id: 2, title: "Another Blog Post" },
      { id: 3, title: "Yet Another Post" }
    ];

    const list = document.getElementById("blogs");
    blogs.forEach(blog => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="blog.html?id=${blog.id}">${blog.title}</a>`;
      list.appendChild(li);
    });
  </script>
</body>
</html>
