<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Posts | MindSpace</title>
    <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
   <header>
    <div class="header-wrapper">
        <div class="logo-wrapper">
        <a class="logo" href="../index.html"><img src="../assets/logo-withtname.svg"></a>
        </div>
        <div class="nav-wrapper">
            <nav class="navbar">
                <ul>
                    <li><a href="../pages/mental-health-info.html">Mental Health Info</a></li>
                    <li><a href="../pages/blog-posts.html">Blog Posts</a></li>
                    <li><a href="../pages/forums.html">Forums</a></li>
                    <li><a href="../pages/testimonials.html">Testimonials</a></li>
                </ul>
            </nav>
        </div>
        <div class="login-btn-wrapper">
            <a href="../pages/login.html" class="login-direct">Login</a>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="overlay-menu">
            <ul>
                <li><a href="../pages/mental-health-info.html">Mental Health Info</a></li>
                <li><a href="../pages/blog-posts.html">Blog Posts</a></li>
                <li><a href="../pages/forums.html">Forums</a></li>
                <li><a href="../pages/testimonials.html">Testimonials</a></li>
            </ul>
        </div>
    </div>
    </header>

    <div class="hero-forums">
        <div class="forums-post-wrapper">
            <h1 class="forums-section-title">Blog Posts</h1>
            <ul id="blogs-list" class="forums-comments">
                <!-- Blog links will be dynamically inserted here -->
            </ul>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const list = document.getElementById("blogs-list");

    try {
        const res = await fetch("/api/blogs");
        if (!res.ok) throw new Error("Failed to fetch blogs");
        const blogs = await res.json();

        if (blogs.length === 0) {
            const li = document.createElement("li");
            li.textContent = "No blogs available yet.";
            list.appendChild(li);
        } else {
            blogs.forEach(blog => {
                const li = document.createElement("li");
                li.className = "comment-input"; // reusing forum post style
                li.innerHTML = `
                    <div class="forums-post-userinfo">
                        <img class="forums-post-pfp" src="../assets/kmini.svg" alt="Author PFP">
                        <div class="forums-post-details">
                            <h2 class="forums-username">${blog.username}</h2>
                            <p class="forums-time">Posted on ${new Date(blog.created_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="forums-post-content">
                        <a href="blog.html?id=${blog.id}" class="forums-textbox-link">${blog.title}</a>
                    </div>
                `;
                list.appendChild(li);
            });
        }
    } catch (err) {
        const li = document.createElement("li");
        li.textContent = "Error loading blogs. Try again later.";
        list.appendChild(li);
        console.error(err);
    }
});
</script>
</body>
</html>
