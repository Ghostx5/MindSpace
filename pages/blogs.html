<div class="hero-forums">
    <div class="forums-post-wrapper">
        <h1>Blogs</h1>
        <ul id="blogs" class="forums-comments">
            <!-- Blog links will be appended here -->
        </ul>
    </div>
</div>

<script>
    // Example hardcoded blogs; replace with actual IDs/titles or fetch from API
    const blogs = [
        { id: 1, title: "My First Blog Post" },
        { id: 2, title: "Another Blog Post" },
        { id: 3, title: "Yet Another Post" }
    ];

    const list = document.getElementById("blogs");
    blogs.forEach(blog => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="blog.html?id=${blog.id}">${blog.title}</a>`;
        list.appendChild(li);
    });
</script>
